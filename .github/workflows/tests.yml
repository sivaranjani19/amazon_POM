name: UI Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: pytest -m "not real_login and not flaky_live_site" --html=report.html --self-contained-html

      - name: Prepare report for Pages
        if: always()
        run: |
          mkdir -p public
          cp report.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
